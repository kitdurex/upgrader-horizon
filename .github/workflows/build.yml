
'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Upgrader
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: wasm32-unknown-unknown

  - name: Check project files
    run: |
      test -f Cargo.toml
      test -f horizon-mod.toml
      test -f src/lib.rs

  - name: Install Horizon builder
    run: cargo install --git https://github.com/Vasysik/horizon-android --branch android cargo-horizon-mod

  - name: Run tests
    run: cargo test

  - name: Build HMOD
    run: cargo horizon-mod build

  - name: Upload HMOD
    uses: actions/upload-artifact@v4
    with:
      name: upgrader-hmod
      path: target/horizon-mod/*.hmod
      if-no-files-found: error
